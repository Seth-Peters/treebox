description: >-
  Python and uv for the treebox checks and the host-side e2e scenarios. Docker
  scenarios run only when a guarded setup probe validates an engine.
setupCommands:
  # A non-zero exit fails the whole sandbox, so the prefetch is optional.
  - '(cd /workspace/treebox && uv sync --extra dev) || echo "Warning: uv sync skipped" >&2'
  - 'bash /workspace/treebox/.warp-factory/runners/start-docker.sh || echo "Warning: no docker engine; docker scenarios are SKIP" >&2'
platform:
  os: linux
  arch: x86_64
  linux:
    dockerImage: ghcr.io/astral-sh/uv:python3.12-bookworm
