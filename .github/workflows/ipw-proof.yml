name: ipw proof (temporary)

# Temporary proof: build the bundled sandbox image on stock Ubuntu 24.04 Docker
# hosts and drive Chromium in it with playwright-cli, `playwright screenshot`
# and a playwright library script. The amd64 cells change one host condition
# at a time (the AppArmor user-namespace sysctl, the seccomp profile) to find
# which one makes Chromium's own sandbox fail. Removed again before merge.

on:
  push:
    branches: [fix/playwright-chromium-linux-hosts]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, userns: default, seccomp: default }
          - { runner: ubuntu-24.04, userns: allowed, seccomp: default }
          - { runner: ubuntu-24.04, userns: default, seccomp: unconfined }
          - { runner: ubuntu-24.04, userns: allowed, seccomp: unconfined }
          - { runner: ubuntu-24.04-arm, userns: default, seccomp: default }
    name: ${{ matrix.runner }} userns=${{ matrix.userns }} seccomp=${{ matrix.seccomp }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Host
        run: |
          uname -m; lsb_release -ds
          docker version --format 'docker {{.Server.Version}} {{.Server.Arch}}'
          docker info --format 'security options: {{.SecurityOptions}}'
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone || true

      - name: Build the bundled image
        working-directory: src/treebox/assets/container
        run: |
          start=$(date +%s)
          docker build -q -t ipw-sandbox:latest --build-arg TZ=UTC .
          echo "build seconds: $(( $(date +%s) - start ))"
          docker run --rm ipw-sandbox:latest sh -c 'echo "PLAYWRIGHT_MCP_SANDBOX=${PLAYWRIGHT_MCP_SANDBOX-<unset>}"; playwright-cli --version; playwright --version'

      - name: Allow unprivileged user namespaces on the host
        if: matrix.userns == 'allowed'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Drive Chromium in a container
        run: |
          args=()
          if [ "${{ matrix.seccomp }}" = unconfined ]; then args+=(--security-opt seccomp=unconfined); fi
          mkdir -p out && chmod 777 out
          docker run --rm "${args[@]}" -v "$PWD/.github/ipw-check.sh:/check.sh:ro" -v "$PWD/out:/out" \
            ipw-sandbox:latest bash /check.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-${{ matrix.runner }}-userns-${{ matrix.userns }}-seccomp-${{ matrix.seccomp }}
          path: out/*.png
          if-no-files-found: ignore
