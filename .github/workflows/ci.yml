name: CI

# The full validation of one commit. release.yml also calls this workflow
# (workflow_call) on the commit it releases, and publishes only if every job
# here passes. Keep all validation in this file, so there is one definition of
# "full validation".

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# In a called workflow, github.workflow is the name of the caller. The group
# therefore keeps a release run on main apart from the CI run for a push to
# main, so neither cancels the other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Lint
        run: uv run -p ${{ matrix.python-version }} --extra dev ruff check src tests

      - name: Format
        run: uv run -p ${{ matrix.python-version }} --extra dev ruff format --check src tests

      - name: Type check
        run: uv run -p ${{ matrix.python-version }} --extra dev mypy

      - name: Test
        # Report-only coverage: surfaces untested branches without gating merges.
        run: uv run -p ${{ matrix.python-version }} --extra dev python -m pytest --cov=treebox --cov-report=term-missing

  smoke:
    name: live host-runner smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      # Full reproducible validation: lint, type checks, shell asset checks,
      # tests, golden CLI snapshots, and a live `treebox create` against a
      # throwaway local git remote.
      - name: validate.sh
        run: ./scripts/validate.sh
