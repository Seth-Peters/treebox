name: Release

# Validate, build and publish treebox.
#
#   * Push a tag like `v0.4.0`            -> clean release version (0.4.0), publish to PyPI + GitHub Release.
#   * Manually run via "Run workflow"     -> builds the selected commit as a dev version, publishes to TestPyPI.
#
# Both paths publish only after the `validate` job passes. That job runs the
# full CI validation (ci.yml, called as a reusable workflow) on the same commit
# that `build` packages. The publish jobs stay in this file, because PyPI
# Trusted Publishing does not accept a reusable workflow as the trusted
# workflow.
#
# Publishing uses PyPI Trusted Publishing (OIDC) - there are NO API tokens or
# secrets to manage. One-time setup, once per index:
#   https://pypi.org      -> Account -> Publishing -> add a "pending" trusted publisher:
#     owner = Seth-Peters, repo = treebox, workflow = release.yml, environment = pypi
#   https://test.pypi.org -> same, with environment = testpypi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags so hatch-vcs can derive the version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Build sdist + wheel
        run: uv build

      - name: Show version being published
        run: ls -1 dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [validate, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-testpypi:
    name: Publish dev build to TestPyPI
    needs: [validate, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: dist/*
