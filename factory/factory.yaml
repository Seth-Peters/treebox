# The software factory, as code.
#
# This manifest is an index, not a generator: the files it points at ARE the
# factory. Claude Managed Agents resources (agents, environment, vault) are
# applied with `ant apply` from this directory; the skills under .claude/skills
# are loaded by the worker from the mounted repo and by your local master
# session alike.
#
# Every outer-loop (improve-factory) PR bumps `version`. Every inner-loop
# session is stamped with it, so any run can be traced to the factory that
# produced it.

name: treebox-factory
version: 0.1.0

repository:
  url: https://github.com/Seth-Peters/treebox
  base_branch: main

# Paths relative to this file. These are what `ant apply` manages; their IDs
# and agent versions live in ./claude-lock.json (commit it).
resources:
  engineer_agent: agents/engineer.md
  reviewer_agent: agents/reviewer.md
  environment: environments/treebox.yaml
  vault: vaults/github.yaml

# The first message every worker session receives (string.Template, $vars).
task_prompt: prompts/task.md

# Defaults for `factory run`.
session:
  budget_usd: 10
  branch_prefix: factory/
  pr_label: factory

# What the outer loop (improve-factory) may change, relative to the repo root.
# Everything that shapes how the factory behaves; never the product it builds.
factory_code:
  editable:
    - factory/**
    - .claude/**
  never:
    - factory/retros/**   # past retros are history; only new ones are added
    - factory/claude-lock.json  # written by `ant apply` after merge, never by hand
    - src/**
    - tests/**
