[project]
name = "treebox-factory"
version = "0.1.0"
description = "Tooling for the treebox software factory (dispatch sessions, check factory code)."
requires-python = ">=3.11"
dependencies = ["anthropic>=2.5", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15", "mypy>=1.14", "types-PyYAML>=6"]

[project.scripts]
factory = "factory_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_cli"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
